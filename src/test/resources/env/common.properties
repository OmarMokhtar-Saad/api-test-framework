# Defaults shared by every environment. Lowest precedence: env/<env>.properties,
# env/<env>.secrets.properties, API_* environment variables and -D properties all override these.
# Never put secrets here: this file is committed. See docs/CONFIGURATION.md.

timeout.connect.ms=5000
timeout.read.ms=15000

# FAILURES (attach HTTP exchanges of failed tests), ALL, or NONE
http.log=FAILURES
http.log.maxBodyChars=20000

# Retries apply to transport failures (IOException) only, never to assertion failures.
retry.max=1
